# RocketMQ 5.x 配置
rocketmq:
  enabled: true
  # 生产者配置
  producer:
    # 接入点地址
    endpoints: localhost:8081
    # 请求超时（秒）
    request-timeout: 3
    # 最大重试次数
    max-attempts: 3
    # 认证信息（阿里云需要配置）
    # access-key: your-access-key
    # secret-key: your-secret-key
  # Push Consumer（简单消费者）配置 — endpoints 已在框架侧自动注入，此处可省略
  simple-consumer:
    endpoints: ${rocketmq.producer.endpoints}
    consumer-group: test-group
    # 消费等待时长（秒）
    await-duration: 30

# 日志配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
