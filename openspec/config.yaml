# OpenSpec 项目配置：schema / context / rules / operations
# schema 声明采用内置 spec-driven 工作流（rules 键对应产物类型 artifact id）
schema: spec-driven

# 项目上下文：注入所有制品的 AI 提示词
context: |
  中文协作仓库：hc-spring-cloud-framework（Spring Cloud 微服务基础框架，10 个可复用
  spring-boot-starter 的多模块 Maven 工程）。所有 spec/proposal/design/tasks/README 一律中文写作。

  ## 坐标与包结构
  groupId=com.hc.framework、version=1.0-SNAPSHOT；代码包根 com.hc.framework，模块目录即
  artifactId（hc-<域>-spring-boot-starter），模块内子包按职责划分（config/exception/util/
  aspect/wrapper/support 等），配置类命名 <Xxx>Properties、自动配置命名 <域>AutoConfiguration。

  ## 技术栈（以根 pom.xml 为准；CLAUDE.md 中 Java17/SB3.3 描述已过期，勿引用）
  Java 21、Spring Boot 4.0.6、Spring Cloud 2025.1.1；Hutool 6.0.0-M12（org.dromara.hutool，含
  hutool-all）、Lombok 1.18.36、Redisson 4.5.0、MyBatis-Plus 3.5.16
  （mybatis-plus-spring-boot4-starter）、Sa-Token 1.45.0、Sentinel 1.8.10、EasyExcel 4.0.3、
  RocketMQ 5.x gRPC starter 2.3.4、transmittable-thread-local 2.14.5、Testcontainers（仅测试）；
  全部模块已引入 spring-boot-configuration-processor(optional) 生成配置元数据。

  ## 模块清单与依赖边界
  - hc-common：纯工具库，无自动配置（StringUtils/PageUtils/IpUtils/DateUtils/JsonUtils 等）
  - hc-web：Result/BusinessException/GlobalExceptionHandler/XSS/请求包装（hc.web.*）
  - hc-redis：缓存/分布式锁/防重/序列（hc.cache.*、hc.redis.*）
  - hc-logging：API 日志/TraceId 透传/@RateLimiter，依赖 web+common（hc.logging.*）
  - hc-mybatis-plus：BaseEntity/BaseService/PageParam/PageData/动态数据源（hc.mybatis-plus.*）
  - hc-satoken / hc-satoken-gateway：认证（gateway 为响应式，供网关，hc.satoken.gateway.*）
  - hc-excel：EasyExcel 导入导出（hc.excel.*）
  - hc-oss：OssService 统一接口 + 阿里云/MinIO/腾讯COS 三实现（hc.oss.*）
  - hc-rocketmq：RocketMqSender/BaseMqConsumer/幂等消费（hc.rocketmq.*）
  模块间依赖尽量 optional；hc-common 不得依赖框架内部模块。

  ## 结构性约定（改动必须遵守）
  - 自动配置经 src/main/resources/META-INF/spring/org.springframework.boot.autoconfigure
    .AutoConfiguration.imports 注册（hc-common 除外）；每个模块具备 hc.<域>.enabled 开关
  - 配置属性集中在 <Xxx>Properties（@ConfigurationProperties(prefix="hc.<域>")），前缀一律 hc.*
  - 示例/演示代码只允许位于 src/test（example 包），禁止进入 src/main 与发布产物
  - 公开 API 不得静默删除或破坏签名；破坏性变化以 **BREAKING** 标注并提供 README 迁移/发布说明
    （弃用排期先例：PageUtils 保留 2 个大版本后于 ≥3.0 删除）
  - Redis key 一律经常量类（如 RedisKeyConstants）引用，禁止业务代码内联前缀；新前缀遵循 hc:{模块}:{业务}
  - 影响线上缓存/序列/消息的前置条件（如先配置白名单再升级）写入模块 README 发布顺序

  ## 规范治理背景
  - 根因文档 hc-spring-cloud-framework-改进方案.md（20 项，P0/P1/P2 分级），change 应可关联 P 编号
  - openspec/specs 已按 build/common/logging/mybatis/oss/redis/rocketmq/web 沉淀 17 个能力；
    excel/satoken/satoken-gateway 暂无规范覆盖（属待治理空白，新能力需先补 spec）

# 各制品规则：键对应产物类型（artifact id），只注入匹配类型的产物
rules:
  proposal:
    - 固定结构（中文）：## Why / ## What Changes / ## Capabilities(New+Modified) / ## Impact
    - Why 点出"现状问题→后果"，可引用改进方案编号（P0-x/P1-x/P2-x），引用前须核对编号与内容对应
    - What Changes 逐条给出可执行改动；凡行为/语义/契约变化显式以 **BREAKING** 标注，说明兼容策略
    - Capabilities 用 <域>/<能力> 命名并核对 openspec/specs 现状：新能力进 New，对既有能力的修订进 Modified（描述增量差异）
    - Impact 覆盖：受影响模块与类（精确到相对路径）、依赖变更、新增/变更配置项（含前缀/默认值）、发布顺序与升级指引、验证方式
    - 篇幅紧凑（≤600 词），突出决策与影响，不复述过程
  design:
    - 中文，结构：Context / Goals / Non-Goals / Decisions / Risks & Trade-offs / Migration Plan / Open Questions
    - 每条 Decision 给出"选型 + 关键备选及不选原因"，下结论前与实际源码核对，避免臆断
    - BREAKING 决策须给出兼容路径（默认值/过渡配置/回滚）；Non-Goals 说明本 change 明确不做的事
    - 修订既有 spec 语义时随 change 走 delta（specs/<change>/<域>/<能力>/spec.md），不在 design 直接改主规范
  tasks:
    - 按能力分节：## N. 标题（<域>/<能力>），子任务带勾选态（- [ ]/- [x]）
    - 每条任务 = 可执行动作 + "验证：具体命令或断言"，粒度以可独立验证为界（命令用 mvn -pl <模块> test / mvn package 等；断言可含检索式，如"检索 com.hnhegui.framework 为空"）
    - 涉及 BREAKING 的任务补充回归检查（旧调用方/缓存清理/发布顺序）与通过标准
  specs:
    - 中文；标题 # <域>/<能力> Specification，含 Purpose 与 Requirements
    - Requirement 用规范动词 SHALL，每条附可执行 Scenario（WHEN/THEN），能被单测/集成测试或检索断言覆盖
    - 与同域既有 spec 及仓库实际实现一致，不写入无法验证的愿望式条款

# 各操作指引（apply/archive 等，按需扩展）
operations:
  apply:
    guidance:
      - 按 tasks.md 顺序推进，先读 proposal/design 建立上下文，改完一个任务勾选一个（- [x]）
      - 单模块改动用 mvn -pl <module> ... 定向构建测试，避免全量扫描；涉及跨模块时最后跑全量 mvn clean install
      - 改 README/发布说明与改代码在同一个 change 内完成；破坏性行为必须同步写升级指引
      - 需要先配置/清缓存等前置条件的变更，把步骤与验证命令回写到 README 对应模块
  archive:
    guidance:
      - 归档前置检查：delta spec 已同步至 openspec/specs、tasks 全勾选、README 发布说明与 BREAKING 标注齐全
      - 归档时给出摘要：解决的问题、新增/修订的 capability、BREAKING 项与升级指引、可执行的回归命令
      - 若 change 留有 Open Questions（如跨模块前缀迁移待认领），在归档摘要中显式提示后续跟进项
